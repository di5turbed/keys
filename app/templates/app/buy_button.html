{% if is_client %}
    <form method="post" action="{% url 'cart_add' product_id=product.id %}" style="margin-top: 10px;">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.get_full_path }}" />
        <button type="submit" class="button-link btn-gold">В корзину</button>
    </form>
{% elif not user.is_authenticated %}
    <p style="margin-top: 10px; font-size: 12px;"><a href="{% url 'login' %}?next={{ request.path }}">Войдите</a> или <a href="{% url 'registration' %}">зарегистрируйтесь</a>, чтобы купить</p>
{% endif %}
