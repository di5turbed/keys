{% extends "app/layout.html" %}

{% block content %}
<div class="auth-container">
    <div class="auth-card block">
        <h2 class="header">Новый пользователь</h2>
        <p id="p1" style="text-align: center;">Регистрация в системе распределения ключей</p>
        
        <form method="POST">
            {% csrf_token %}
            
            <div class="registration-form-fields" style="color: var(--text-main);">
                {{ regform.as_p }}
            </div>
            
            <div class="nav-link" style="margin-top: 30px;">
                <button type="submit" class="button-link" style="width: 100%; border: none;">Создать аккаунт</button>
            </div>
        </form>

        <div style="text-align: center; margin-top: 20px;">
            <a href="{% url 'login' %}" style="color: var(--accent-green); font-size: 12px;">Уже есть профиль? Войти</a>
        </div>
    </div>
</div>

<style>
    .registration-form-fields p {
        background: none !important;
        text-indent: 0 !important;
        padding: 0 !important;
        margin-bottom: 15px;
    }
    .registration-form-fields label {
        margin-bottom: 5px;
    }
    .registration-form-fields input {
        width: 100%;
        padding: 8px;
        background: rgba(11, 12, 16, 0.6);
        border: 1px solid var(--accent-green);
        color: var(--accent-cyan);
    }
    .helptext {
        display: block;
        font-size: 10px;
        color: var(--accent-green);
        margin-top: 4px;
        opacity: 0.7;
    }
</style>
{% endblock %}
