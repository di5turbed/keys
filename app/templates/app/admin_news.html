{% extends "app/layout.html" %}

{% block content %}
<h1 class="header">{{ title }}</h1>
<div class="block">
    <a href="{% url 'newpost' %}" class="button-link btn-gold">+ Добавить новость</a>
    <div class="table-scroll" style="margin-top: 20px;">
    <table class="shop-table">
        <thead><tr><th>Дата</th><th>Заголовок</th><th>Автор</th><th></th></tr></thead>
        <tbody>
        {% for post in posts %}
            <tr>
                <td>{{ post.posted|date:"d.m.Y H:i" }}</td>
                <td><a href="{% url 'blogpost' parametr=post.id %}">{{ post.title }}</a></td>
                <td>{{ post.author.username }}</td>
                <td style="white-space: nowrap;">
                    <a href="{% url 'news_edit' post_id=post.id %}" class="button-link btn-sm-link">Изменить</a>
                    <a href="{% url 'news_delete' post_id=post.id %}" class="button-link btn-sm-link btn-danger-link">Удалить</a>
                </td>
            </tr>
        {% empty %}
            <tr><td colspan="4">Новостей нет.</td></tr>
        {% endfor %}
        </tbody>
    </table>
    </div>
</div>
{% endblock %}
