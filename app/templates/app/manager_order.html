{% extends "app/layout.html" %}

{% block content %}
<h1 class="header">{{ title }}</h1>
<div class="row">
    <div class="col-md-7">
        <div class="block">
            {% include 'app/order_info.html' %}
        </div>
    </div>
    <div class="col-md-5">
        <div class="block form-page">
            <h3 style="color: var(--accent-cyan); margin-top: 0;">Управление заказом</h3>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="actions">
                    <button type="submit" class="button-link btn-gold">Сохранить</button>
                    <a href="{% url 'manager_orders' %}" class="button-link">← К заказам</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
