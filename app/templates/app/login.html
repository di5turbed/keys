{% extends "app/layout.html" %}

{% block content %}
<div class="auth-container">
    <div class="auth-card block">
        <h2 class="header">Инициализация</h2>
        <p id="p1" style="text-align: center; margin-bottom: 25px;">Введите учетные данные для доступа к библиотеке</p>
        
        <form action="." method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label>Идентификатор (Login)</label>
                {{ form.username }}
            </div>
            
            <div class="form-group">
                <label>Код доступа (Password)</label>
                {{ form.password }}
            </div>
            
            <div class="nav-link" style="margin-top: 30px;">
                <input type="hidden" name="next" value="/" />
                <button type="submit" class="button-link" style="width: 100%; border: none;">Войти</button>
            </div>

            {% if form.errors %}
            <div class="alert alert-danger" style="margin-top: 20px; font-size: 13px;">
                Ошибка: Неверный идентификатор или код доступа.
            </div>
            {% endif %}
        </form>
        
        <div style="text-align: center; margin-top: 20px;">
            <a href="{% url 'registration' %}" style="color: var(--accent-green); font-size: 12px; text-decoration: underline;">Создать новый профиль</a>
        </div>
    </div>
</div>
{% endblock %}
